<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIC Converter | A.U.M.Ahsan</title>

    <!-- TailwindCSS -->
    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>
  <body class="relative min-h-screen flex items-center justify-center bg-gray-900">

    <!-- Background -->
     <img src="./assets/bg.png" alt="">
    <div class="absolute inset-0">
      <img src="./assets/img/bg.png" alt="Background" class="w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-br from-blue-900/60 via-purple-900/60 to-pink-900/60"></div>
    </div>

    <!-- Main Card -->
    <main class="relative w-full max-w-md p-6 bg-white/10 backdrop-blur-md rounded-2xl shadow-lg text-white">

      <!-- Header -->
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold">NIC Converter</h1>
        <a href="https://github.com/Aum-Ahsan/" target="_blank" class="hover:text-gray-300 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0.5C5.37 0.5 0 5.87 0 12.5c0 5.29 3.438 9.77 8.205 11.36.6.11.82-.26.82-.58 0-.29-.01-1.07-.016-2.1-3.338.73-4.042-1.61-4.042-1.61-.546-1.39-1.334-1.76-1.334-1.76-1.09-.745.082-.73.082-.73 1.204.085 1.838 1.238 1.838 1.238 1.07 1.832 2.807 1.303 3.492.996.108-.774.418-1.304.76-1.604-2.665-.304-5.467-1.334-5.467-5.932 0-1.31.467-2.382 1.235-3.222-.123-.303-.535-1.523.117-3.176 0 0 1.008-.323 3.3 1.23a11.5 11.5 0 013.003-.404 11.47 11.47 0 013.003.404c2.29-1.554 3.296-1.23 3.296-1.23.655 1.653.244 2.873.12 3.176.77.84 1.234 1.912 1.234 3.222 0 4.61-2.807 5.625-5.48 5.922.43.372.814 1.104.814 2.225 0 1.606-.014 2.9-.014 3.293 0 .32.216.694.824.576C20.565 22.27 24 17.79 24 12.5 24 5.87 18.627.5 12 .5z"/>
          </svg>
        </a>
      </div>
      <hr class="border-gray-400/50 mb-4" />

      <p class="text-sm text-gray-200 mb-6">
Easily convert Sri Lankan NICs to the latest format and check DOB & Gender instantly.
        <a href="https://github.com/Aum-Ahsan/" class="border-b-2 border-white/50 hover:border-white transition">A.U.M. Ahsan</a>
      </p>

      <!-- NIC Form -->
      <form>
        <label for="nic" class="text-sm">NIC Number:</label>
        <input id="nic" type="text" placeholder="Enter your NIC number"
               class="w-full px-4 py-2 rounded-lg outline-none text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-purple-500" />
        <button type="submit" class="w-full mt-3 bg-purple-600 hover:bg-purple-700 py-2 rounded-lg font-semibold transition-transform hover:scale-105">
          Find
        </button>
      </form>

      <!-- NIC Info Card -->
      <div id="nicInfo" class="hidden bg-white/10 backdrop-blur-md rounded-lg p-4 mt-6 text-gray-100 text-sm
                  transform transition-all duration-700 opacity-0 translate-y-5">
        <h4 class="text-lg font-semibold text-center mb-2 animate-pulse">NIC Information</h4>
        <img id="avatar" src="" alt="avatar" class="rounded-full w-24 h-24 mx-auto my-3 border-2 border-white/30 animate-bounce" />
        <div class="space-y-1">
          <p>NIC Number: <span id="nicNo"></span></p>
          <p>New Format: <span id="newNicNo"></span></p>
          <p>Gender: <span id="gender"></span></p>
          <p>Date of Birth (DOB): <span id="dob"></span></p>
        </div>
        <button id="copyBtn" class="mt-3 w-full bg-purple-600 hover:bg-purple-700 py-2 rounded-lg font-semibold transition-transform hover:scale-105">
          Copy Info
        </button>
      </div>

    </main>

    <!-- JS -->
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
